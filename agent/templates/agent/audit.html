{% extends "agent/base.html" %}
{% block content %}
<h1>Audit log</h1>
<div class="card"><table>
<tr><th>Time</th><th>Who</th><th>User record</th><th>Action</th><th>Detail</th></tr>
{% for l in logs %}<tr><td class="muted">{{ l.created_at|date:"d M Y H:i" }}</td><td>{{ l.actor|default:"system" }}</td><td>{{ l.candidate|default:"" }}</td><td>{{ l.action }}</td><td class="muted">{{ l.detail|truncatechars:160 }}</td></tr>{% endfor %}
</table></div>
{% endblock %}
