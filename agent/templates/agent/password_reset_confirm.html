{% extends "agent/base.html" %}
{% block content %}
<div style="max-width:460px;margin:40px auto" class="card">
{% if validlink %}<h1>Choose a new password</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}<p style="margin-top:12px"><button class="big" style="width:100%;justify-content:center">Save new password</button></p></form>
{% else %}<h1>Link expired</h1><p>This reset link is not valid any more. Please ask for a new one.</p><p><a class="btn" href="{% url 'password_reset' %}">Get a new link</a></p>{% endif %}
</div>
{% endblock %}
